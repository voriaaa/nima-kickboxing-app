name: Screenshots

# Renders screenshots of the main screens and pushes them to the `screens` branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, screens]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Render
        run: |
          flutter test --update-goldens tool/screenshots/screenshot_test.dart > shots.log 2>&1 || {
            { grep -A 8 "The following" shots.log | head -30; grep -vE "^\s*$" shots.log | tail -20; } > t.txt; split -l 6 t.txt p_
            for f in $(ls p_* | head -9); do echo "::error::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done
            exit 1; }

      - name: Push to screens branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          files=$(find . -path ./build -prune -o -name '*.png' -path '*goldens*' -print)
          echo "::notice::found $(echo "$files" | wc -l) screenshots"
          mkdir -p /tmp/shots && cp $files /tmp/shots/
          cd /tmp/shots
          git init -q -b screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screens 2>&1 | tail -3 || { echo "::error::push failed"; exit 1; }
