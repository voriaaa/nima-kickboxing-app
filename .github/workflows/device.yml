name: Device test

# Installs the release APK on an Android emulator, launches it, takes real
# screenshots and collects the crash log. Results go to the `device` branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [screens, device]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare
        run: bash tool/ci_prepare.sh

      - name: Build release APK
        run: flutter build apk --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tool/device_check.sh

      - name: Report
        if: always()
        run: |
          [ -f device/status.txt ] && while IFS= read -r l; do echo "::notice::$l"; done < device/status.txt
          if [ -s device/errors.txt ]; then
            split -l 6 device/errors.txt e_
            for f in $(ls e_* | head -9); do echo "::error::$(sed 's/%/%25/g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done
          fi

      - name: Push results to device branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d device ] || exit 0
          rm -f device/ui.xml
          cp -r device /tmp/dev && cd /tmp/dev
          git init -q -b device
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Device run for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" device 2>&1 | tail -2
