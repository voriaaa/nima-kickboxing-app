name: Build APK

# Builds an APK on every push. Only pushes to main publish a Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is not in the repo; it is generated here.
      - name: Generate Android project files
        run: flutter create . --platforms=android --org ir.nimaafshar --project-name nima_kickboxing

      - name: App name and link permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="باشگاه نیما افشار"/' $M
          # Android 11+ needs to know which apps we open (browser/Instagram/Telegram, dialer, SMS)
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent><intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent><intent><action android:name="android.intent.action.SENDTO"/><data android:scheme="sms"/></intent></queries>\n    <application#' $M
          grep -c 'android.intent.action.DIAL' $M

      - run: flutter pub get

      - name: Launcher icon
        run: dart run flutter_launcher_icons

      - run: flutter test

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk nima-kickboxing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nima-kickboxing-apk
          path: nima-kickboxing.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: nima-kickboxing.apk
