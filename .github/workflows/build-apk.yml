name: Build APK

# با هر پوش روی شاخه‌ی main، فایل APK ساخته می‌شود.
# فایل نصب در تب Actions (بخش Artifacts) و در بخش Releases مخزن قرار می‌گیرد.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # پوشه‌ی android در مخزن نیست؛ اینجا ساخته می‌شود.
      - name: Generate Android project files
        run: flutter create . --platforms=android --org ir.nimaafshar --project-name nima_kickboxing

      - name: Set Persian app name
        run: sed -i 's/android:label="[^"]*"/android:label="باشگاه نیما افشار"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter test

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk nima-kickboxing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nima-kickboxing-apk
          path: nima-kickboxing.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: nima-kickboxing.apk
